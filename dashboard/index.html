<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'; media-src 'none'; worker-src 'none'; upgrade-insecure-requests">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0b1020">
<title>لوحة النشر | أحمد نوتس</title>
<meta name="description" content="لوحة متابعة النشر على المنصات: الحالة، المنشور، المجدول، الفاشل، وسجل الأخطاء.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/extra.css">
<link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>
<a class="skip" href="#dash">تخطَّ إلى المحتوى</a>
<header class="nav">
  <a class="brand" href="/" aria-label="أحمد نوتس">
    <span class="logo">أ</span><span class="brand-text">أحمد <b>نوتس</b></span>
  </a>
  <div class="actions">
    <a class="icon-btn" href="/" aria-label="الصفحة الرئيسية" title="الرئيسية">⌂</a>
    <button class="icon-btn" id="themeBtn" type="button" aria-label="تبديل الوضع الليلي والنهاري" title="الوضع">◐</button>
  </div>
</header>

<main class="dash" id="dash">
  <div class="wrap">
    <div class="dash-head">
      <div>
        <p class="kicker">إدارة النشر</p>
        <h1 class="dash-title">لوحة <span class="grad">المنصات</span></h1>
      </div>
      <p class="muted updated" id="updated" role="status">جارٍ تحميل البيانات…</p>
    </div>

    <section aria-label="حالة المنصات">
      <div class="plats" id="plats"></div>
    </section>

    <section aria-label="ملخص سريع">
      <ul class="kpis" id="kpis"></ul>
    </section>

    <section class="dash-sec" aria-labelledby="t-best">
      <h2 id="t-best">أفضل المحتوى</h2>
      <div class="posts" id="best"></div>
    </section>

    <section class="dash-sec" aria-labelledby="t-pub">
      <h2 id="t-pub">منشور</h2>
      <div class="posts" id="published"></div>
    </section>

    <section class="dash-sec" aria-labelledby="t-sch">
      <h2 id="t-sch">مجدول</h2>
      <div class="posts" id="scheduled"></div>
    </section>

    <section class="dash-sec" aria-labelledby="t-queue">
      <h2 id="t-queue">في الانتظار</h2>
      <div class="posts" id="queue"></div>
    </section>

    <section class="dash-sec" aria-labelledby="t-fail">
      <h2 id="t-fail">فاشل</h2>
      <div class="posts" id="failed"></div>
    </section>

    <section class="dash-sec" aria-labelledby="t-err">
      <h2 id="t-err">سجل الأخطاء</h2>
      <div class="posts" id="errors"></div>
    </section>
  </div>
</main>

<footer class="footer">
  <p>© <span id="year"></span> أحمد نوتس</p>
  <p class="muted"><a href="/">الصفحة الرئيسية</a></p>
</footer>

<script src="/js/dashboard.js"></script>
<button class="top-btn" id="topBtn" type="button" aria-label="العودة للأعلى" title="للأعلى">↑</button>
</body>
</html>
